# ---------------------------------------------------------------------------
# Worker-Profil: Kimi K3 (Moonshot) — Bestandsverhalten, unveraendert.
#
# Wird von worker.sh und preflight.sh GESOURCET, nie ausgefuehrt. Jede
# Variable traegt das Praefix PROFIL_, damit ein Profil nie versehentlich
# eine Umgebungsvariable des Aufrufers ueberschreibt.
# Endung .conf statt .env: der safety-guard-Hook und guard_find_env behandeln
# ".env*" als Geheimnis-Dateien — ein Profil ist Konfiguration, kein Secret
# (der Key liegt in PROFIL_KEY_FILE, nie hier).
#
# Marker-Pfade sind EXAKT und bleiben die historischen Namen: Zeile 1 der
# Marker traegt die belegte Claude-Code-Version, der Versions-Riegel haengt
# daran (worker.sh, T4/T8-Gates). NICHT umbenennen.
# ---------------------------------------------------------------------------

# Endpunkt. Abo: api.kimi.com/coding/ (Modell k3, ANTHROPIC_API_KEY).
# Plattform-Alternative: https://api.moonshot.ai/anthropic, Modell kimi-k3,
# ANTHROPIC_AUTH_TOKEN. Overrides zur Laufzeit: KIMI_BASE_URL / KIMI_MODEL /
# KIMI_KEY_VAR (siehe PROFIL_OVERRIDE_PREFIX).
PROFIL_BASE_URL="https://api.kimi.com/coding/"
PROFIL_MODEL="k3"
PROFIL_KEY_VAR="ANTHROPIC_API_KEY"
PROFIL_KEY_FILE="C:/Users/User/.claude/.kimi-key"

# Name in der Export-Freigabe-Frage an Oliver (einmal je Lauf).
PROFIL_EXPORT_LABEL="Moonshot/Kimi (China)"

# Exakte Marker-Pfade relativ zu SKILLDIR.
PROFIL_T4_MARKER=".kimi-t4-passed"
PROFIL_T8_MARKER=".kimi-t8-passed"

# Namespace fuer Session-State, Raw-Envelope und generierte Settings:
# .kimi-session-<slug>.*, .kimi-raw-<slug>-<modus>.json, .kimi-settings-<slug>.json
PROFIL_SESSION_PREFIX="kimi"

# Deny-Regeln (Read/Edit auf .env, recht/, .planning/ usw.).
PROFIL_SETTINGS_FILE="kimi-worker-settings.json"

# Praefix der Laufzeit-Override-Variablen:
#   <PREFIX>_ENV_GUARD_VERIFIED=1  uebersteuert das T4-Gate
#   <PREFIX>_RESUME_VERIFIED=1     uebersteuert das T8-Gate
#   <PREFIX>_BASE_URL/_MODEL/_KEY_VAR  uebersteuern den Endpunkt
PROFIL_OVERRIDE_PREFIX="KIMI"

PROFIL_MAX_BUDGET_USD="8"

# Leer = resume braucht nur das T8-Gate (Bestandsverhalten Kimi).
# Gesetzt = zusaetzlich muss diese Marker-Datei existieren (Online-Zeuge,
# siehe deepseek.conf).
PROFIL_RESUME_ONLINE_MARKER=""

# Kimi-ToS erlauben Training auf Inhalten — Begruendung der Sperrliste in
# kimi-guards.sh gilt fuer dieses Profil unmittelbar.
