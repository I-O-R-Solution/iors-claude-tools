# Anthropic-kompatibler Endpunkt (DeepSeek-Doku 2026). Der Endpunkt mappt
# claude-opus* -> deepseek-v4-pro; der native Name wird hier direkt gesetzt.
# Beim ersten Echt-Lauf verifizieren, dass der native Name akzeptiert wird —
# sonst auf das Mapping ausweichen und diesen Kommentar aktualisieren.
PROFIL_BASE_URL="https://api.deepseek.com/anthropic"
PROFIL_MODEL="deepseek-v4-pro"
PROFIL_KEY_VAR="ANTHROPIC_API_KEY"
PROFIL_KEY_FILE="C:/Users/User/.claude/.deepseek-key"

PROFIL_EXPORT_LABEL="DeepSeek (China)"

# Neue Profile bekommen NEUE Marker — nie von Kimi geerbt.
PROFIL_T4_MARKER=".t4-passed-deepseek"
PROFIL_T8_MARKER=".t8-passed-deepseek"

PROFIL_SESSION_PREFIX="deepseek"

# BEWUSST dieselbe Datei wie das kimi-Profil: die Deny-Liste ist
# anbieterneutral (Personendaten, Geheimnisse, Kernkapital), und eine Kopie
# je Profil waere genau die Doppelung, an der die Riegel schon einmal
# auseinandergelaufen sind (kimi-guards.sh, Kopfkommentar).
PROFIL_SETTINGS_FILE="kimi-worker-settings.json"

PROFIL_OVERRIDE_PREFIX="DEEPSEEK"

PROFIL_MAX_BUDGET_USD="8"

# resume nur mit Online-Zeugen: Datei anlegen tut ausschliesslich der
# protokollierte Echt-resume-Test (Datum + Ergebnis in Zeile 1), nie die Hand.
PROFIL_RESUME_ONLINE_MARKER=".resume-online-deepseek"
